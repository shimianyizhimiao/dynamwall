<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>數位雨 Digital Rain</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ══════════════════════════════════════════════════════════
   數位雨 ─ 改下面的 CONFIG，存檔後桌面會「立刻」更新
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  動畫速度:    1.0,
  字級:        20,          // 每格文字大小（px）
  顏色:        '#22c55e',   // 雨滴主色
  亮頭顏色:    '#d9f99d',   // 每串最前面那顆字的顏色
  背景色:      '#000000',
  殘影:        0.90,        // 0.8~0.99，越大拖尾越長
  尾巴長度:    0.14,        // 每串長度佔畫面高度比例
  文字:        'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFアカサタナ$#%@&'
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, cols = 0, drops = [], speeds = [], tails = [];

function setup(){
  cols = Math.ceil(W / (CONFIG.字級 * 0.85));
  drops  = Array.from({length: cols}, () => Math.random() * -H);
  speeds = Array.from({length: cols}, () => (2 + Math.random() * 6));
  tails  = Array.from({length: cols}, () => Math.floor((CONFIG.尾巴長度 * H / CONFIG.字級) * (0.5 + Math.random())));
  ctx.fillStyle = CONFIG.背景色;
  ctx.fillRect(0, 0, W, H);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  setup();
}
window.addEventListener('resize', resize);
resize();

function randChar(){
  return CONFIG.文字[Math.floor(Math.random() * CONFIG.文字.length)];
}

function frame(){
  ctx.fillStyle = 'rgba(0,0,0,' + (1 - CONFIG.殘影) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.font = CONFIG.字級 + 'px "Menlo", "Hiragino Sans", monospace';
  ctx.textBaseline = 'top';

  for (let i = 0; i < cols; i++){
    const x = i * CONFIG.字級 * 0.85;
    drops[i] += speeds[i] * CONFIG.動畫速度;

    // 亮頭
    ctx.fillStyle = CONFIG.亮頭顏色;
    ctx.shadowColor = CONFIG.顏色;
    ctx.shadowBlur = 10;
    ctx.fillText(randChar(), x, drops[i]);
    ctx.shadowBlur = 0;

    // 尾巴（越後面越暗）
    ctx.fillStyle = CONFIG.顏色;
    for (let k = 1; k < tails[i]; k++){
      ctx.globalAlpha = Math.max(0, 1 - k / tails[i]) * 0.85;
      ctx.fillText(randChar(), x, drops[i] - k * CONFIG.字級);
    }
    ctx.globalAlpha = 1;

    if (drops[i] > H + 40){
      drops[i] = -Math.random() * H * 0.4;
      speeds[i] = 2 + Math.random() * 6;
      tails[i] = Math.floor((CONFIG.尾巴長度 * H / CONFIG.字級) * (0.5 + Math.random()));
    }
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
