<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>極光 Aurora</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060d;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ══════════════════════════════════════════════════════════
   極光 Aurora ─ 動態壁紙（可自訂）
   改下面的 CONFIG，存檔後桌面會「立刻」更新（不用重開 App）
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  動畫速度:      0.7,                                   // 越大動得越快
  光帶數量:      3,                                     // 極光簾幕層數 1~6
  光帶高度:      0.42,                                  // 佔畫面高度比例
  顏色:          ['#22d3ee', '#34d399', '#a78bfa'],     // 每層的顏色
  背景色:        '#04060d',
  地平線微光:    '#0b1a33',
  星星數量:      160,
  輝光強度:      0.55,                                  // 0~1，越低越暗
  暗角強度:      0.55                                   // 0~1，四角變暗量
};

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = [], t = 0;

function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({length: CONFIG.星星數量}, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.8,
    r: Math.random() * 1.3 + 0.25,
    p: Math.random() * Math.PI * 2,
    s: Math.random() * 0.8 + 0.3
  }));
}
window.addEventListener('resize', resize);

function frame(){
  t += CONFIG.動畫速度 * 0.012;

  // 夜空底色
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, CONFIG.背景色);
  sky.addColorStop(1, CONFIG.地平線微光);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 星星閃爍
  for (const st of stars){
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * st.s + st.p));
    ctx.globalAlpha = tw * 0.9;
    ctx.fillStyle = '#dbeafe';
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 極光（疊加混色）
  ctx.globalCompositeOperation = 'lighter';
  const n = CONFIG.光帶數量;
  for (let i = 0; i < n; i++){
    const color = CONFIG.顏色[i % CONFIG.顏色.length];
    const phase = i * 2.31;
    const speed = 0.65 + i * 0.21;
    const baseY = H * (0.60 - i * 0.065);
    const height = H * CONFIG.光帶高度 * (0.78 + 0.22 * Math.sin(t * 0.8 + phase));

    const g = ctx.createLinearGradient(0, baseY - height, 0, baseY + H * 0.2);
    g.addColorStop(0.00, hexA(color, 0));
    g.addColorStop(0.30, hexA(color, 0.60 * CONFIG.輝光強度));
    g.addColorStop(0.62, hexA(color, 0.26 * CONFIG.輝光強度));
    g.addColorStop(1.00, hexA(color, 0));

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8){
      const u = x / W;
      const wave = Math.sin(u * 6.4 + t * speed + phase) * 0.50
                 + Math.sin(u * 15.0 - t * speed * 1.7 + phase) * 0.22
                 + Math.sin(u * 2.1 + t * 0.45) * 0.38;
      ctx.lineTo(x, baseY - height * 0.5 + wave * height * 0.45);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  // 簾幕直紋（讓極光有絲狀質感）
  ctx.globalAlpha = 0.16 * CONFIG.輝光強度;
  for (let i = 0; i < 46; i++){
    const x = ((i * 137.5 + t * 22) % (W + 400)) - 200;
    const c = CONFIG.顏色[i % CONFIG.顏色.length];
    const grad = ctx.createLinearGradient(0, H * 0.15, 0, H * 0.85);
    grad.addColorStop(0, hexA(c, 0));
    grad.addColorStop(0.5, hexA(c, 1));
    grad.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(x, H * 0.15, 2.2, H * 0.7);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 暗角
  const v = ctx.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.25, W / 2, H * 0.5, Math.max(W, H) * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,' + CONFIG.暗角強度 + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
