<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>賽博格柵 Cyber Grid</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#08010f;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ══════════════════════════════════════════════════════════
   賽博格柵 ─ 復古未來風（夕陽 + 透視格線 + 掃描線）
   改下面的 CONFIG，存檔後桌面會「立刻」更新
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  動畫速度:    1.0,
  格線速度:    0.55,      // 格線往自己衝過來的速度
  格線顏色:    '#ff2bd6',
  格線數量:    26,        // 越少格線越寬
  夕陽顏色:    ['#ffd166', '#ff6b6b', '#c026d3'],  // 由上到下
  天空色:      '#08010f',
  地面色:      '#10021c',
  太陽大小:    0.30,      // 佔畫面高度比例
  掃描線:      true,
  山脈:        true
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, t = 0;

function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

const HORIZON = () => H * 0.58;

function frame(){
  t += 0.016 * CONFIG.動畫速度;
  const hy = HORIZON();

  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, CONFIG.天空色);
  sky.addColorStop(1, hexA(CONFIG.夕陽顏色[2], 0.35));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, hy);

  // 夕陽圓盤 + 橫條切口
  const r = H * CONFIG.太陽大小 / 2;
  const sunY = hy - r * 0.42;
  ctx.save();
  ctx.beginPath();
  ctx.arc(W / 2, sunY, r, 0, 6.2832);
  ctx.clip();
  const sg = ctx.createLinearGradient(0, sunY - r, 0, sunY + r);
  sg.addColorStop(0, CONFIG.夕陽顏色[0]);
  sg.addColorStop(0.5, CONFIG.夕陽顏色[1]);
  sg.addColorStop(1, CONFIG.夕陽顏色[2]);
  ctx.fillStyle = sg;
  ctx.fillRect(W / 2 - r, sunY - r, r * 2, r * 2);
  // 切口（越下越寬）
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 16; i++){
    const p = i / 16;
    const y = sunY - r * 0.1 + p * r * 1.1;
    const hgt = 2 + p * p * 13;
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(W / 2 - r, y, r * 2, hgt);
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(W / 2, sunY, r * 0.5, W / 2, sunY, r * 2.6);
  glow.addColorStop(0, hexA(CONFIG.夕陽顏色[1], 0.32));
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, hy + r);
  ctx.globalCompositeOperation = 'source-over';

  // 山脈剪影
  if (CONFIG.山脈){
    ctx.fillStyle = '#0a0114';
    ctx.beginPath();
    ctx.moveTo(0, hy);
    for (let x = 0; x <= W; x += 6){
      const u = x / W;
      const n = Math.sin(u * 9 + 1.2) * 0.5 + Math.sin(u * 23 + 0.4) * 0.28 + Math.sin(u * 4.5) * 0.45;
      ctx.lineTo(x, hy - (H * 0.055) * (0.55 + 0.45 * n));
    }
    ctx.lineTo(W, hy);
    ctx.closePath();
    ctx.fill();
  }

  // 地面
  ctx.fillStyle = CONFIG.地面色;
  ctx.fillRect(0, hy, W, H - hy);

  // 透視格線（縱向）
  const vanishX = W / 2;
  ctx.strokeStyle = hexA(CONFIG.格線顏色, 0.75);
  ctx.lineWidth = 1.4;
  for (let i = -CONFIG.格線數量; i <= CONFIG.格線數量; i++){
    const spread = W * 1.6;
    ctx.beginPath();
    ctx.moveTo(vanishX + (i / CONFIG.格線數量) * spread * 0.10, hy);
    ctx.lineTo(vanishX + (i / CONFIG.格線數量) * spread, H + 40);
    ctx.stroke();
  }

  // 橫向格線（會動）
  const rows = CONFIG.格線數量;
  const phase = (t * CONFIG.格線速度) % 1;
  for (let i = 0; i < rows; i++){
    let p = (i / rows + phase) % 1;
    const y = hy + (H - hy) * Math.pow(p, 2.4);
    const a = 0.15 + 0.85 * p;
    ctx.strokeStyle = hexA(CONFIG.格線顏色, 0.22 + a * 0.6);
    ctx.lineWidth = 0.8 + p * 2.2;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // 地平線光
  const hg = ctx.createLinearGradient(0, hy - 6, 0, hy + 26);
  hg.addColorStop(0, hexA('#22d3ee', 0));
  hg.addColorStop(0.4, hexA('#67e8f9', 0.85));
  hg.addColorStop(1, hexA('#22d3ee', 0));
  ctx.fillStyle = hg;
  ctx.fillRect(0, hy - 6, W, 32);

  // 掃描線 + 暗角
  if (CONFIG.掃描線){
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
